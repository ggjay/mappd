<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappd — 大路线时序智能决策体系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F4F0E8; --surface: #FDFBF7; --surface2: #EFECE6;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #9E9B94;
    --accent: #4A5B4E; --accent-light: #E2E7E3; --accent2: #B56545;
    --border: rgba(26,24,20,0.08); --border2: rgba(26,24,20,0.04);
    --radius: 12px; --radius-sm: 8px;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
  .app { display: grid; grid-template-columns: 460px 1fr; height: 100vh; overflow: hidden; }
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 24px 24px 0; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo-mark { width: 32px; height: 32px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-mark i { color: var(--surface); font-size: 17px; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); letter-spacing: -0.3px; }
  
  .input-section { padding: 0 24px; flex-shrink: 0; }
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; display: block; }
  .input-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); outline: none; }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  .gen-btn { width: 100%; padding: 13px; background: var(--ink); color: var(--surface); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; margin-bottom: 16px; }
  .gen-btn:disabled { background: var(--ink3); cursor: not-allowed; }
  .gen-btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .divider { height: 1px; background: var(--border2); margin: 0 24px; flex-shrink: 0; }
  .results-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
  .results-scroll::-webkit-scrollbar { width: 4px; }
  .results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  
  .option-card { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; cursor: pointer; transition: all 0.25s ease; }
  .option-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 6px 24px rgba(74,91,78,0.06); }
  
  .opt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .opt-name { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; }
  .opt-badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 500; background: var(--surface2); color: var(--ink2); }
  .option-card.active .opt-badge { background: var(--accent); color: #fff; }
  .opt-desc { font-size: 13px; color: var(--ink2); margin-bottom: 14px; }
  
  .finance-block { display: flex; gap: 16px; background: rgba(26,24,20,0.03); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .fin-item { flex: 1; }
  .fin-label { font-size: 11px; color: var(--ink3); text-transform: uppercase; }
  .fin-val { font-size: 19px; font-weight: 700; color: var(--accent2); }
  .option-card.active .fin-val { color: var(--accent); }
  
  .timeline-container { position: relative; padding-left: 18px; border-left: 2px solid var(--border); margin-top: 14px; }
  .timeline-node { position: relative; margin-bottom: 20px; padding: 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; transition: all 0.2s ease; }
  .option-card.active .timeline-node { background: #FDFBF7; }
  
  /* 💥 联动聚焦高亮状态 */
  .timeline-node.focused-node { border-color: var(--ink) !important; background: var(--surface2) !important; transform: translateX(2px); }
  
  .node-dot { position: absolute; left: -25px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--ink3); }
  .node-flow-flight .node-dot { border-color: var(--accent2); }
  .node-flow-drive .node-dot { border-color: var(--accent); }
  
  .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .node-days { font-size: 11px; font-weight: 600; color: #fff; padding: 1px 6px; border-radius: 4px; }
  .node-flow-flight .node-days { background: var(--accent2); }
  .node-flow-drive .node-days { background: var(--accent); }
  .node-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .node-detail { font-size: 13px; font-weight: 500; margin: 4px 0; color: #1a1814; }
  .node-sub { font-size: 11px; color: var(--ink2); }
  .node-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: rgba(0,0,0,0.02); padding: 6px; border-radius: 4px; font-size: 11px; color: var(--ink2); margin-top: 4px; }
  .detail-section { margin-bottom: 16px; background: rgba(26,24,20,0.01); padding: 12px; border-radius: 8px; border: 1px solid var(--border2); }
  .detail-row { font-size: 12px; display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border2); color: var(--ink2); }
  
  .lock-btn { width: 100%; padding: 12px; background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; margin-top: 14px; cursor: pointer; display: none; text-align: center; }
  .option-card.active .lock-btn { display: block; }
  
  .empty-state { text-align: center; padding: 40px 0; color: var(--ink3); font-size: 13px; }
  .empty-state i { font-size: 32px; opacity: 0.4; display: block; margin-bottom: 8px; }
  
  /* 地图及初始看板图设计 */
  .map-container { position: relative; background: #E8E2D5; height: 100vh; }
  #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #E8E2D5; }
  
  .map-placeholder { 
    position: absolute; inset: 0; 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    background: radial-gradient(circle at center, #FDFBF7 0%, #E8E2D5 100%); 
    z-index: 5; padding: 40px; text-align: center;
  }
  .guide-title { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--ink); margin-bottom: 8px; letter-spacing: -0.5px; }
  .guide-subtitle { font-size: 16px; color: var(--ink2); margin-bottom: 40px; font-weight: 500; }
  
  .astrolabe-wrapper { position: relative; width: 340px; height: 340px; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
  .astrolabe-orbit { position: absolute; border: 1px dashed rgba(26,24,20,0.15); border-radius: 50%; }
  .orbit-1 { width: 340px; height: 340px; animation: orbit-rot 50s linear infinite; }
  .orbit-2 { width: 220px; height: 220px; animation: orbit-rot 35s linear infinite reverse; }
  
  .astrolabe-center { width: 100px; height: 100px; background: #4A5B4E; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 36px; box-shadow: 0 10px 30px rgba(74,91,78,0.25); z-index: 2; }
  
  .helper-bubble { position: absolute; background: #fff; border: 1px solid var(--border); padding: 10px 16px; border-radius: 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; transition: all 0.3s ease; cursor: pointer; }
  .helper-bubble:hover { transform: scale(1.05); border-color: var(--accent); box-shadow: 0 10px 25px rgba(74,91,78,0.12); }
  .helper-bubble i { font-size: 16px; color: var(--ink2); background: var(--bg); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .helper-bubble .b-title { font-size: 12px; font-weight: 600; color: var(--ink); }
  .helper-bubble .b-desc { font-size: 10px; color: var(--ink3); white-space: nowrap; }
  
  .b-pos1 { top: -10px; left: 110px; }
  .b-pos2 { top: 110px; right: -60px; }
  .b-pos3 { bottom: -10px; left: 110px; }
  .b-pos4 { top: 110px; left: -60px; }
  
  @keyframes orbit-rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  .bottom-dock { position: absolute; bottom: 30px; background: #fff; border: 1px solid var(--border); padding: 10px 24px; border-radius: 32px; display: flex; gap: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.06); z-index: 10; }
  .dock-item { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 12px; font-weight: 600; cursor: pointer; transition: color 0.2s; }
  .dock-item:hover { color: var(--accent); }
  .dock-item i { font-size: 16px; }
  
  /* 💥 SVG 曲线流向的基础 CSS 样式 */
  .animated-flow-path { fill: none; stroke-linecap: round; stroke-dasharray: 8, 8; animation: curve-ant-flow 5s linear infinite; transition: stroke 0.25s, stroke-width 0.25s, filter 0.25s; }
  @keyframes curve-ant-flow { from { stroke-dashoffset: 50; } to { stroke-dashoffset: 0; } }
  
  /* 💥 激活联动时的强力高亮视觉渲染类 */
  .animated-flow-path.highlight-active { stroke: #ff4500 !important; stroke-width: 6.5 !important; animation-duration: 1.5s !important; filter: drop-shadow(0 0 5px rgba(255,69,0,0.6)); opacity: 1 !important; }

  .macro-clean-circle { background: #1A1814; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 20px !important; height: 20px !important; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
  .loading-overlay { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .loading-title { font-size: 22px; font-weight: 500; color: var(--ink); }
  .notif { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 200; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
  .notif.show { transform: translateY(0); opacity: 1; }
  .notif.error { background: #B56545; }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-compass"></i></div>
        <div>
          <div class="logo-name">Mappd</div>
          <div class="tagline" style="font-size:11px; color:var(--ink3);">大路线时序智能决策体系</div>
        </div>
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-row">
        <div class="input-group"><label class="input-label">出发城市</label><input class="input-field" id="start-point" type="text" value="成都"></div>
        <div class="input-group"><label class="input-label">目的地群</label><input class="input-field" id="destination" type="text" value="西班牙、葡萄牙、亚速尔群岛"></div>
      </div>
      <div class="input-row">
        <div class="input-group"><label class="input-label">行程天数</label><input class="input-field" id="duration" type="number" value="10"></div>
        <div class="input-group"><label class="input-label">旅行人数</label><input class="input-field" id="travelers" type="number" value="2"></div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generateOptions()">
        <div class="spinner"></div>
        <span class="btn-text"><i class="ti ti-calculator"></i> &nbsp;开始大路线时序精算</span>
      </button>
    </div>
    
    <div class="divider"></div>
    <div class="results-scroll">
      <div class="empty-state" id="empty-state">
        <i class="ti ti-history"></i>
        <p>配置沙盘参数，大模型将同轴生成<br>Day 1 至 Day 10 无断层时序闭环</p>
      </div>
      <div id="options-list"></div>
    </div>
  </div>
  
  <div class="map-container" id="right-map-area">
    <div class="map-placeholder" id="map-placeholder">
      <div class="guide-title">智能规划助手</div>
      <div class="guide-subtitle">一键规划，后续直接订票</div>
      
      <div class="astrolabe-wrapper">
        <div class="astrolabe-orbit orbit-1"></div>
        <div class="astrolabe-orbit orbit-2"></div>
        <div class="astrolabe-center"><i class="ti ti-sparkles"></i></div>
        
        <div class="helper-bubble b-pos1"><i class="ti ti-user"></i><span class="b-title">智能理解</span><span class="b-desc">偏好 | 预算 | 约束</span></div>
        <div class="helper-bubble b-pos2"><i class="ti ti-git-commit"></i><span class="b-title">一键规划</span><span class="b-desc">多方案生成 / 最优推荐</span></div>
        <div class="helper-bubble b-pos3"><i class="ti ti-shield-check"></i><span class="b-title">安心出行</span><span class="b-desc">行程提醒 | 应急支持</span></div>
        <div class="helper-bubble b-pos4"><i class="ti ti-refresh"></i><span class="b-title">实时优化</span><span class="b-desc">动态调整更优体验</span></div>
      </div>
      
      <p style="font-size:13px; color:var(--ink2); font-weight:500; margin-bottom:20px;">时序沙盘流水轨迹将在此纯净流淌</p>
    </div>
    
    <div id="map"></div>
    
    <div class="bottom-dock" style="left: 50%; transform: translateX(-50%);">
      <div class="dock-item"><i class="ti ti-plane"></i> 机票</div>
      <div class="dock-item"><i class="ti ti-building-skyscrapers"></i> 酒店</div>
      <div class="dock-item"><i class="ti ti-train"></i> 火车票</div>
      <div class="dock-item"><i class="ti ti-ticket"></i> 景点门票</div>
      <div class="dock-item"><i class="ti ti-dots"></i> 更多服务</div>
    </div>
    
    <div class="loading-overlay" id="loading-overlay">
      <div class="loading-title">精算师正在构建宏观时空曲线沙盘...</div>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null, macroMarkers = [], curveSvgLayers = [], globalOptions = [];
let currentActiveSegments = []; // 全局缓存地理线条坐标资产

function showNotif(msg, isError = false) {
  const n = document.getElementById('notif'); if(!n) return;
  n.textContent = msg; n.className = 'notif show' + (isError ? ' error' : '');
  setTimeout(() => n.className = 'notif', 5000);
}

function initMacroMap() {
  if (map) return;
  document.getElementById('map-placeholder').style.display = 'none';
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([38.8, -14.0], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 10 }).addTo(map);

  // 💥 严密监听底图的生命周期位移：每次缩放、拖拽，都会毫秒级强制重算更新 SVG
  map.on('zoomend moveend viewreset', () => {
    recalculateAllCurves();
  });
}

function clearMacroLayers() {
  macroMarkers.forEach(m => m?.remove()); macroMarkers = [];
  curveSvgLayers.forEach(l => l?.remove()); curveSvgLayers = [];
  currentActiveSegments = [];
}

// 💥 几何计算器：根据当前视窗的最优投影，计算出反向、带对称弧度的贝塞尔弯曲指令
function computeSvgPathString(fromLatLng, toLatLng, isReturn) {
  const startP = map.latLngToLayerPoint(fromLatLng);
  const endP = map.latLngToLayerPoint(toLatLng);
  
  const midX = (startP.x + endP.x) / 2;
  const midY = (startP.y + endP.y) / 2;
  
  const dx = endP.x - startP.x;
  const dy = endP.y - startP.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  
  if (len === 0) return '';

  const offset = len * 0.15; // 弯曲跨度系数
  const nX = -dy / len;
  const nY = dx / len;
  
  // 通过正负反转 offset，让去程向上挺，回程向下沉，拉开平行轨道
  const controlX = midX + nX * (isReturn ? -offset : offset);
  const controlY = midY + nY * (isReturn ? -offset : offset);

  return `M ${startP.x} ${startP.y} Q ${controlX} ${controlY} ${endP.x} ${endP.y}`;
}

// 💥 SVG 大管家：统一用固定的全球投影层进行渲染，彻底杜绝图层“随风飘散”的宿疾
function renderCurvesOnMap(segments, optionId) {
  curveSvgLayers.forEach(l => l?.remove());
  curveSvgLayers = [];
  
  if (!segments || segments.length === 0) return;

  const svgNS = "http://www.w3.org/2000/svg";
  const svgEl = document.createElementNS(svgNS, "svg");
  svgEl.setAttribute('style', 'position: absolute; pointer-events: none; width: 100%; height: 100%;');

  segments.forEach((seg, sIdx) => {
    if (!seg || !seg.coords || seg.coords.length < 2) return;
    if (seg.coords[0][0] === seg.coords[1][0] && seg.coords[0][1] === seg.coords[1][1]) return;

    const pathString = computeSvgPathString(seg.coords[0], seg.coords[1], seg.is_return);
    if (!pathString) return;

    const pathEl = document.createElementNS(svgNS, "path");
    const isDrive = seg.mode === 'drive';
    
    pathEl.setAttribute('d', pathString);
    pathEl.setAttribute('stroke', isDrive ? '#4A5B4E' : '#B56545');
    pathEl.setAttribute('stroke-width', '3.5');
    pathEl.setAttribute('fill', 'none');
    pathEl.setAttribute('opacity', '0.75');
    pathEl.setAttribute('class', 'animated-flow-path');
    pathEl.setAttribute('style', `stroke-dasharray: ${isDrive ? '10, 8' : '3, 10'};`);
    pathEl.setAttribute('id', `curve-opt-${optionId}-flow-${sIdx}`);

    svgEl.appendChild(pathEl);
  });

  // 锁死全球边界，使像素坐标系与 Leaflet 完全熔断一体
  const svgOverlay = L.svgOverlay(svgEl, [[-90, -180], [90, 180]]).addTo(map);
  curveSvgLayers.push(svgOverlay);
}

function recalculateAllCurves() {
  const activeCard = document.querySelector('.option-card.active');
  if (!activeCard || currentActiveSegments.length === 0) return;
  
  const idx = parseInt(activeCard.id.replace('opt-card-', ''));
  const opt = globalOptions[idx];
  if (opt) {
    renderCurvesOnMap(currentActiveSegments, opt.option_id);
  }
}

function highlightCurveSegment(optionId, flowIndex, active) {
  const el = document.getElementById(`curve-opt-${optionId}-flow-${flowIndex}`);
  const node = document.getElementById(`node-opt-${optionId}-flow-${flowIndex}`);
  if (!el) return;
  if (active) {
    el.classList.add('highlight-active');
    if(node) node.classList.add('focused-node');
  } else {
    el.classList.remove('highlight-active');
    if(node) node.classList.remove('focused-node');
  }
}

async function generateOptions() {
  const start_point = document.getElementById('start-point').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const days = document.getElementById('duration').value;
  const travelers = document.getElementById('travelers').value;

  const btn = document.getElementById('gen-btn'); if(btn) { btn.disabled = true; btn.classList.add('loading'); }
  const overlay = document.getElementById('loading-overlay'); if(overlay) overlay.className = 'loading-overlay active';

  try {
    const res = await fetch('/api/plan_options', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start_point, destination, days, travelers })
    });
    if (!res.ok) throw new Error(`服务端异常: ${res.status}`);
    
    const data = await res.json();
    globalOptions = data.options;
    renderOptionCards(data.options);
    const est = document.getElementById('empty-state'); if(est) est.style.display = 'none';
    
    initMacroMap();
    selectCard(0);
  } catch (e) {
    showNotif(e.message, true);
  } finally {
    if(overlay) overlay.className = 'loading-overlay';
    if(btn) { btn.disabled = false; btn.classList.remove('loading'); }
  }
}

function renderOptionCards(options) {
  const list = document.getElementById('options-list'); if(!list) return;
  list.innerHTML = '';

  options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = `option-card ${idx === 0 ? 'active' : ''}`; card.id = `opt-card-${idx}`;
    
    let timelineHtml = opt.timeline_flows.map((flow, fIdx) => {
      let isDrive = flow.type === 'drive';
      let metaHtml = isDrive ? `
        <div class="node-meta-grid">
          <div>🔑 <b>取车:</b> ${flow.meta_json?.pickup || '机场门店'}</div>
          <div>🏁 <b>还车:</b> ${flow.meta_json?.dropoff || '机场门店'}</div>
          <div>📏 <b>里程:</b> ${flow.meta_json?.distance || '计算中'}</div>
          <div style="color:var(--accent); font-weight:600;">⏱️ <b>纯驾车:</b> ${flow.meta_json?.drive_hours || '计算中'}</div>
        </div>
      ` : `
        <div class="node-meta-grid" style="grid-template-columns:1fr;">
          <div>💰 <b>预算分摊:</b> ${flow.cost_info || '参考套票'}</div>
        </div>
      `;

      return `
        <div class="timeline-node node-flow-${flow.type}" id="node-opt-${opt.option_id}-flow-${fIdx}"
             onmouseenter="highlightCurveSegment(${opt.option_id}, ${fIdx}, true)"
             onmouseleave="highlightCurveSegment(${opt.option_id}, ${fIdx}, false)">
          <div class="node-dot"></div>
          <div class="node-header">
            <span class="node-title">${flow.title || '行程节点'}</span>
            <span class="node-days">${flow.days_range || ''}</span>
          </div>
          <div class="node-detail">${flow.detail_title || ''}</div>
          <div class="node-sub">
            <span style="color:var(--accent2); font-weight:500;">${flow.time_window || ''}</span> &nbsp;|&nbsp; <span>${flow.duration_desc || ''}</span>
          </div>
          ${metaHtml}
          <div style="font-size:11px; color:#856404; background:#FFF9E6; padding:4px 6px; border-radius:4px; margin-top:5px; line-height:1.3;">
            💡 <b>时序提醒:</b> ${flow.note || ''}
          </div>
        </div>
      `;
    }).join('');

    let hotelHtml = opt.accommodation_summary ? opt.accommodation_summary.map(h => `<div class="detail-row"><span>🏨 ${h.city} (宿 ${h.nights} 晚)</span><span>均价:${h.avg_price} / 小计:${h.total}</span></div>`).join('') : '';

    card.innerHTML = `
      <div class="opt-header"><div class="opt-name">${opt.option_name}</div><div class="opt-badge">方案 ${idx + 1}</div></div>
      <div class="opt-desc">${opt.logic_desc}</div>
      <div class="finance-block">
        <div class="fin-item"><div class="fin-label">团队总开销</div><div class="fin-val">${opt.total_group_cost}</div></div>
        <div class="fin-item"><div class="fin-label">全员人均</div><div class="fin-val">${opt.cost_per_person}</div></div>
      </div>
      
      <div class="detail-title" style="margin-top:14px;"><i class="ti ti-git-commit"></i> 全生命周期时序流水账沙盘</div>
      <div class="timeline-container">${timelineHtml}</div>
      <div class="detail-section" style="margin-top:14px;"><div class="detail-title"><i class="ti ti-bed"></i> 长途间夜总额分摊</div>${hotelHtml}</div>
      <button class="lock-btn" onclick="lockThisOption(${opt.option_id}, event)">确定此方向，开始微观细分景点 🚀</button>
    `;

    card.addEventListener('click', (e) => {
      if(e.target.tagName === 'BUTTON' || e.target.parentElement.tagName === 'BUTTON' || e.target.closest('.timeline-node')) return;
      selectCard(idx);
    });
    list.appendChild(card);
  });
}

function selectCard(idx) {
  document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
  const targetCard = document.getElementById(`opt-card-${idx}`); if(!targetCard) return;
  targetCard.classList.add('active');
  
  const opt = globalOptions[idx];
  if(!opt || !opt.macro_route) return;
  
  clearMacroLayers();
  
  // 注入全量图层线段资产到重绘缓存中
  if(opt.macro_route.segments) {
    currentActiveSegments = opt.macro_route.segments;
  }
  
  map.setView([opt.macro_route.center_lat || 39.5, opt.macro_route.center_lng || -8.0], opt.macro_route.zoom_level || 5);

  // 绘制大节点序号小圈
  if(opt.macro_route.anchors) {
    opt.macro_route.anchors.forEach((anchor, aIdx) => {
      const cleanIcon = L.divIcon({ className: 'macro-clean-circle', html: `${aIdx + 1}`, iconSize: [20, 20], iconAnchor: [10, 10] });
      const m = L.marker(anchor.latlng, { icon: cleanIcon }).addTo(map);
      m.bindTooltip(`<div style="font-weight:600; padding:1px 3px;">${aIdx+1}. ${anchor.name}</div>`, { permanent: true, direction: 'top', offset: [0, -10] });
      macroMarkers.push(m);
    });
  }

  // 触发首刷渲染
  renderCurvesOnMap(currentActiveSegments, opt.option_id);
}

function lockThisOption(optionId, event) {
  event.stopPropagation(); alert(`大路线时序已完美锁定！`);
}
</script>
</body>
</html>
