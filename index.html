<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappd — 大路线智能沙盘决策器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F2EC; --surface: #FDFBF7; --surface2: #F0EDE5;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #9E9B94;
    --accent: #2D6A4F; --accent-light: #D8EDDF; --accent2: #B5451B;
    --border: rgba(26,24,20,0.1); --border2: rgba(26,24,20,0.06);
    --radius: 12px; --radius-sm: 8px;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
  .app { display: grid; grid-template-columns: 460px 1fr; height: 100vh; overflow: hidden; }
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 24px 24px 0; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo-mark { width: 32px; height: 32px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-mark i { color: var(--surface); font-size: 17px; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); letter-spacing: -0.3px; }
  .logo-name span { color: var(--accent); }
  
  .input-section { padding: 0 24px; flex-shrink: 0; }
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; display: block; }
  .input-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .input-field:focus { border-color: var(--accent); }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  .gen-btn { width: 100%; padding: 13px; background: var(--ink); color: var(--surface); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; margin-bottom: 16px; position: relative; }
  .gen-btn:disabled { background: var(--ink3); cursor: not-allowed; }
  .gen-btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .divider { height: 1px; background: var(--border2); margin: 0 24px; flex-shrink: 0; }
  .results-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
  .results-scroll::-webkit-scrollbar { width: 4px; }
  .results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  
  .option-card { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; cursor: pointer; transition: all 0.25s ease; }
  .option-card:hover { border-color: rgba(45,106,79,0.4); }
  .option-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 6px 24px rgba(45,106,79,0.06); }
  
  .opt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .opt-name { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; padding-right: 10px; }
  .opt-badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 500; background: var(--surface2); color: var(--ink2); }
  .option-card.active .opt-badge { background: var(--accent); color: #fff; }
  .opt-desc { font-size: 13px; color: var(--ink2); margin-bottom: 14px; line-height: 1.5; }
  
  .finance-block { display: flex; gap: 16px; background: rgba(26,24,20,0.03); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .option-card.active .finance-block { background: rgba(45,106,79,0.04); }
  .fin-item { flex: 1; }
  .fin-label { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; }
  .fin-val { font-size: 19px; font-weight: 700; color: var(--accent2); }
  .option-card.active .fin-val { color: var(--accent); }
  
  .detail-title { font-size: 12px; font-weight: 600; color: var(--ink); text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .timeline-container { position: relative; padding-left: 18px; border-left: 2px solid var(--border); margin-top: 14px; }
  .timeline-node { position: relative; margin-bottom: 20px; padding: 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; transition: all 0.2s ease; }
  .option-card.active .timeline-node { background: #FDFBF7; }
  .timeline-node:hover { border-color: var(--ink); transform: translateX(2px); }
  
  .node-dot { position: absolute; left: -25px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--ink3); }
  .timeline-node:hover .node-dot { background: var(--ink); border-color: var(--ink); }
  .node-flow-flight .node-dot { border-color: var(--accent2); }
  .node-flow-drive .node-dot { border-color: var(--accent); }
  
  .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .node-days { font-size: 11px; font-weight: 600; color: #fff; background: var(--ink2); padding: 1px 6px; border-radius: 4px; }
  .node-flow-flight .node-days { background: var(--accent2); }
  .node-flow-drive .node-days { background: var(--accent); }
  
  .node-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .node-detail { font-size: 13px; font-weight: 500; margin: 4px 0; color: #1a1814; }
  .node-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: rgba(0,0,0,0.02); padding: 6px; border-radius: 4px; font-size: 11px; color: var(--ink2); margin-top: 4px; }
  .detail-section { margin-bottom: 16px; background: rgba(26,24,20,0.01); padding: 12px; border-radius: 8px; border: 1px solid var(--border2); }
  .option-card.active .detail-section { background: #FDFBF7; }
  
  .detail-row { font-size: 12px; display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border2); color: var(--ink2); }
  .lock-btn { width: 100%; padding: 12px; background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; margin-top: 14px; cursor: pointer; display: none; text-align: center; }
  .option-card.active .lock-btn { display: block; }
  
  .empty-state { text-align: center; padding: 60px 0; color: var(--ink3); }
  .empty-state i { font-size: 40px; opacity: 0.3; display: block; margin-bottom: 12px; }
  
  .map-container { position: relative; background: #e8e0d0; height: 100vh; }
  #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
  
  .map-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #FDFBF7 0%, #E8E0D0 100%); z-index: 5; overflow: hidden; }
  .sandbox-canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.25; transition: transform 0.1s ease-out; }
  .placeholder-astrolabe { width: 180px; height: 180px; border: 2px dashed var(--ink3); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: slow-spin 40s linear infinite; }
  .placeholder-center-core { width: 50px; height: 50px; background: var(--ink); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
  @keyframes slow-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  @keyframes ant-flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  .animated-flow-line { animation: ant-flow 12s linear infinite !important; }
  .animated-flow-line.highlight-active { stroke-width: 5.5 !important; opacity: 1 !important; animation-duration: 4s !important; }
  .macro-clean-circle { background: #1A1814; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 16px !important; height: 16px !important; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  
  .loading-overlay { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .loading-title { font-size: 22px; font-weight: 500; color: var(--ink); }
  .notif { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 200; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
  .notif.show { transform: translateY(0); opacity: 1; }
  .notif.error { background: #B5451B; }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-compass"></i></div>
        <div>
          <div class="logo-name">Mapp<span>d</span></div>
          <div class="tagline">大路线时序智能决策体系</div>
        </div>
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">出发城市</label>
          <input class="input-field" id="start-point" type="text" value="成都">
        </div>
        <div class="input-group">
          <label class="input-label">目的地群</label>
          <input class="input-field" id="destination" type="text" value="西班牙、葡萄牙、亚速尔群岛">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">行程天数</label>
          <input class="input-field" id="duration" type="number" value="10">
        </div>
        <div class="input-group">
          <label class="input-label">旅行人数</label>
          <input class="input-field" id="travelers" type="number" value="2">
        </div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generateOptions()">
        <div class="spinner"></div>
        <span class="btn-text"><i class="ti ti-calculator"></i> &nbsp;开始大路线时序精算</span>
      </button>
    </div>
    
    <div class="divider"></div>
    <div class="results-scroll">
      <div class="empty-state" id="empty-state">
        <i class="ti ti-history"></i>
        <p>配置沙盘参数，大模型将同轴生成<br>Day 1 至 Day 10 无断层时序闭环</p>
      </div>
      <div id="options-list"></div>
    </div>
  </div>
  
  <div class="map-container" id="right-map-area">
    <div class="map-placeholder" id="map-placeholder">
      <svg class="sandbox-canvas" id="sandbox-canvas"></svg>
      <div class="placeholder-astrolabe"><div class="placeholder-center-core"><i class="ti ti-windmill"></i></div></div>
      <p style="margin-top:20px; font-size:13px; color:var(--ink2); font-weight:500;">时序沙盘流水轨迹将在此纯净流淌</p>
    </div>
    <div id="map"></div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null, macroMarkers = [], polylineLayers = {}, globalOptions = [];
const mapArea = document.getElementById('right-map-area');
const canvas = document.getElementById('sandbox-canvas');

function buildCanvasLines() {
  let width = mapArea.clientWidth; let height = mapArea.clientHeight;
  canvas.setAttribute('viewBox', `0 0 ${width} ${height}`);
  let html = '';
  for(let i=0; i<width; i+=90){ html += `<line x1="${i}" y1="0" x2="${width - i}" y2="${height}" stroke="#1A1814" stroke-width="0.5" stroke-dasharray="4,8"/>`; }
  canvas.innerHTML = html;
}
window.addEventListener('resize', buildCanvasLines); buildCanvasLines();

function showNotif(msg, isError = false) {
  const n = document.getElementById('notif'); n.textContent = msg; 
  n.className = 'notif show' + (isError ? ' error' : '');
  setTimeout(() => n.className = 'notif', 5000);
}

function initMacroMap(lat, lng, zoom) {
  if (map) { map.remove(); map = null; }
  document.getElementById('map-placeholder').style.display = 'none';
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([lat, lng], zoom);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 12 }).addTo(map);
}

function clearMacroLayers() {
  macroMarkers.forEach(m => m.remove()); macroMarkers = [];
  Object.values(polylineLayers).forEach(l => l.remove()); polylineLayers = {};
}

function drawMacroRoute(routeData, optionId) {
  clearMacroLayers();
  const centerLat = routeData.center_lat || 39.5;
  const centerLng = routeData.center_lng || -8.0;
  const zoomLevel = routeData.zoom_level || 5;

  if (!map) { initMacroMap(centerLat, centerLng, zoomLevel); } 
  else { map.setView([centerLat, centerLng], zoomLevel); }

  if (routeData.segments && routeData.segments.length) {
    routeData.segments.forEach((seg, sIdx) => {
      const isDrive = seg.mode === 'drive';
      const lineColor = isDrive ? '#2D6A4F' : '#B5451B';
      const lineDash = isDrive ? '12, 10' : '4, 12';
      
      const poly = L.polyline(seg.coords, {
        color: lineColor, weight: 3.5, opacity: 0.7, dashArray: lineDash, className: 'animated-flow-line' 
      }).addTo(map);
      
      const flowId = `opt-${optionId}-flow-${sIdx}`;
      polylineLayers[flowId] = poly;
    });
  }

  if (routeData.anchors && routeData.anchors.length) {
    routeData.anchors.forEach((anchor, idx) => {
      const cleanIcon = L.divIcon({ className: 'macro-clean-circle', html: `${idx + 1}`, iconSize: [16, 16], iconAnchor: [8, 8] });
      const m = L.marker([anchor.lat, anchor.lng], { icon: cleanIcon }).addTo(map);
      m.bindTooltip(`<div style="font-weight:600; font-size:12px; padding:1px 3px;">${idx+1}. ${anchor.name}</div>`, {
        permanent: true, direction: 'top', offset: [0, -8]
      });
      macroMarkers.push(m);
    });
  }
}

function highlightMapSegment(optionId, flowIndex, active) {
  const targetId = `opt-${optionId}-flow-${flowIndex}`;
  const layer = polylineLayers[targetId];
  if (!layer || !layer.getElement()) return;
  if (active) { layer.getElement().classList.add('highlight-active'); } 
  else { layer.getElement().classList.remove('highlight-active'); }
}

async function generateOptions() {
  const start_point = document.getElementById('start-point').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const days = document.getElementById('duration').value;
  const travelers = document.getElementById('travelers').value;

  const btn = document.getElementById('gen-btn'); 
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('loading-overlay').className = 'loading-overlay active';

  try {
    const res = await fetch('/api/plan_options/', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start_point, destination, days, travelers })
    });

    // 💥 增加核心安全锁：非 200 状态立刻熔断弹出错误信息，杜绝死等
    if (!res.ok) {
      throw new Error(`服务器响应失败（状态码: ${res.status}）。可能原因：大模型组织长文本超时超过 Vercel 10秒限制。`);
    }

    const data = await res.json();
    globalOptions = data.options;
    renderOptionCards(data.options);
    document.getElementById('empty-state').style.display = 'none';
    selectCard(0);
  } catch (e) {
    showNotif(e.message, true);
    console.error(e);
  } finally {
    // 💥 无论成功失败，铁定释放灰色的 loading 按钮和遮罩层
    document.getElementById('loading-overlay').className = 'loading-overlay';
    btn.disabled = false; btn.classList.remove('loading');
  }
}

function renderOptionCards(options) {
  const list = document.getElementById('options-list'); list.innerHTML = '';

  options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = `option-card ${idx === 0 ? 'active' : ''}`; card.id = `opt-card-${idx}`;
    
    let timelineHtml = opt.timeline_flows.map((flow, fIdx) => {
      let isDrive = flow.type === 'drive';
      let metaHtml = isDrive ? `
        <div class="node-meta-grid">
          <div>🔑 <b>取车:</b> ${flow.meta_json.pickup}</div>
          <div>🏁 <b>还车:</b> ${flow.meta_json.dropoff}</div>
          <div>📏 <b>里程:</b> ${flow.meta_json.distance}</div>
          <div style="color:var(--accent); font-weight:600;">⏱️ <b>纯驾车:</b> ${flow.meta_json.drive_hours}</div>
        </div>
      ` : `
        <div class="node-meta-grid" style="grid-template-columns:1fr;">
          <div>💰 <b>预算分摊:</b> ${flow.cost_info}</div>
        </div>
      `;

      const mapLineMap = isDrive ? 0 : (fIdx > 1 ? 1 : -1);

      return `
        <div class="timeline-node node-flow-${flow.type}" 
             onmouseenter="highlightMapSegment(${opt.option_id}, ${mapLineMap}, true)"
             onmouseleave="highlightMapSegment(${opt.option_id}, ${mapLineMap}, false)">
          <div class="node-dot"></div>
          <div class="node-header">
            <span class="node-title">${flow.title}</span>
            <span class="node-days">${flow.days_range}</span>
          </div>
          <div class="node-detail">${flow.detail_title}</div>
          <div class="node-sub">
            <span style="color:var(--accent2); font-weight:500;">${flow.time_window}</span> &nbsp;|&nbsp; <span>${flow.duration_desc}</span>
          </div>
          ${metaHtml}
          <div style="font-size:11px; color:#856404; background:#FFF9E6; padding:4px 6px; border-radius:4px; margin-top:5px; line-height:1.3;">
            💡 <b>时序提醒:</b> ${flow.note}
          </div>
        </div>
      `;
    }).join('');

    let hotelHtml = opt.accommodation_summary.map(h => `<div class="detail-row"><span>🏨 ${h.city} (宿 ${h.nights} 晚)</span><span>均价:${h.avg_price} / 小计:${h.total}</span></div>`).join('');

    card.innerHTML = `
      <div class="opt-header"><div class="opt-name">${opt.option_name}</div><div class="opt-badge">方案 ${idx + 1}</div></div>
      <div class="opt-desc">${opt.logic_desc}</div>
      <div class="finance-block">
        <div class="fin-item"><div class="fin-label">团队总开销</div><div class="fin-val">${opt.total_group_cost}</div></div>
        <div class="fin-item"><div class="fin-label">全员人均</div><div class="fin-val">${opt.cost_per_person}</div></div>
      </div>
      
      <div class="detail-title" style="margin-top:14px;"><i class="ti ti-git-commit"></i> 全生命周期时序流水账沙盘</div>
      <div class="timeline-container">${timelineHtml}</div>
      <div class="detail-section" style="margin-top:14px;"><div class="detail-title"><i class="ti ti-bed"></i> 长途间夜总额分摊</div>${hotelHtml}</div>
      <button class="lock-btn" onclick="lockThisOption(${opt.option_id}, event)">确定此方向，开始微观细分景点 🚀</button>
    `;

    card.addEventListener('click', (e) => {
      if(e.target.tagName === 'BUTTON' || e.target.parentElement.tagName === 'BUTTON' || e.target.closest('.timeline-node')) return;
      selectCard(idx);
    });
    list.appendChild(card);
  });
}

function selectCard(idx) {
  document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
  if(!document.getElementById(`opt-card-${idx}`)) return;
  document.getElementById(`opt-card-${idx}`).classList.add('active');
  if(globalOptions[idx] && globalOptions[idx].macro_route) {
    drawMacroRoute(globalOptions[idx].macro_route, globalOptions[idx].option_id);
  }
}

function lockThisOption(optionId, event) {
  event.stopPropagation(); alert(`大路线时序已完美锁定！`);
}
</script>
</body>
</html>
