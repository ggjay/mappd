<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappd — J人自由行时序决策沙盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F4F0E8; --surface: #FDFBF7; --surface2: #EFECE6;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #9E9B94;
    --accent: #4A5B4E; --accent-light: #E2E7E3; --accent2: #B56545;
    --border: rgba(26,24,20,0.08); --border2: rgba(26,24,20,0.04);
    --radius: 12px; --radius-sm: 8px;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
  .app { display: grid; grid-template-columns: 460px 1fr; height: 100vh; overflow: hidden; }
  
  /* 左侧看板：纯宏观方案指挥部 */
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 24px 24px 0; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo-mark { width: 32px; height: 32px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-mark i { color: var(--surface); font-size: 17px; }
  .logo-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--ink); letter-spacing: -0.3px; }
  
  .input-section { padding: 0 24px; flex-shrink: 0; }
  .input-group { margin-bottom: 10px; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; display: block; }
  .input-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; font-family: var(--font-body); font-size: 13px; color: var(--ink); outline: none; }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  .pref-tags { display: flex; gap: 8px; margin-top: 4px; }
  .pref-tag { flex: 1; text-align: center; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink2); transition: all 0.2s; }
  .pref-tag.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .gen-btn { width: 100%; padding: 12px; background: var(--ink); color: var(--surface); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; margin-bottom: 16px; }
  .gen-btn:disabled { background: var(--ink3); cursor: not-allowed; }
  .gen-btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .divider { height: 1px; background: var(--border2); margin: 0 24px; flex-shrink: 0; }
  .results-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
  
  .option-card { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; cursor: pointer; transition: all 0.25s ease; }
  .option-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 6px 24px rgba(74,91,78,0.06); }
  
  .finance-block { display: flex; gap: 16px; background: rgba(26,24,20,0.03); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 12px; }
  .fin-item { flex: 1; }
  .fin-label { font-size: 11px; color: var(--ink3); text-transform: uppercase; }
  .fin-val { font-size: 19px; font-weight: 700; color: var(--accent2); }
  .option-card.active .fin-val { color: var(--accent); }
  
  .lock-btn { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; margin-top: 12px; cursor: pointer; text-align: center; border-image: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.1)); }

  .empty-state { text-align: center; padding: 60px 0; color: var(--ink3); font-size: 14px; }
  .empty-state h3 { font-size: 18px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty-state i { font-size: 36px; opacity: 0.5; display: block; margin-bottom: 12px; color: var(--accent); }
  
  /* 右侧大地图主战场容器布局 */
  .map-container { position: relative; background: #E8E2D5; height: 100vh; }
  #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; background: #E8E2D5; }
  
  /* 平铺部署于地图顶部的宏/微观多Tab导航轴 */
  .map-top-navigation-bar { 
    position: absolute; top: 20px; left: 20px; right: 20px; 
    background: #fff; border: 1px solid var(--border); padding: 6px; 
    border-radius: var(--radius); z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    display: flex; gap: 6px; overflow-x: auto; scroll-behavior: smooth;
  }
  .map-top-navigation-bar::-webkit-scrollbar { height: 2px; }
  .map-nav-tab { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--ink2); border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all 0.2s; background: var(--bg); }
  .map-nav-tab.active { background: var(--ink); color: #fff; }
  
  /* 地图画布内部悬浮的【原子节点分天微观卡片舱】 */
  .map-floating-micro-pane {
    position: absolute; top: 85px; right: 20px; width: 340px; max-height: calc(100vh - 170px);
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 16px;
    display: none; flex-direction: column; overflow-y: auto;
  }
  .map-floating-micro-pane.active { display: flex; }
  .micro-pane-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border2); padding-bottom: 8px; }
  
  .micro-spot-card { background: var(--bg); border: 1px solid var(--border2); padding: 12px; border-radius: 8px; margin-bottom: 12px; position: relative; transition: border-color 0.2s; }
  .micro-spot-card:hover { border-color: var(--accent); }
  .micro-spot-tag { position: absolute; right: 12px; top: 12px; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .tag-food { background: #FFF0F5; color: #C71585; }
  .tag-view { background: #E6F2FF; color: #1E90FF; }
  
  .map-placeholder { 
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    background: radial-gradient(circle at center, #FDFBF7 0%, #E8E2D5 100%); z-index: 5; padding: 40px; text-align: center;
  }
  .guide-title { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--ink); margin-bottom: 8px; }
  .guide-subtitle { font-size: 15px; color: var(--ink2); margin-bottom: 40px; font-weight: 500; }
  .astrolabe-wrapper { position: relative; width: 340px; height: 340px; display: flex; align-items: center; justify-content: center; margin-bottom: 40px; }
  .astrolabe-orbit { position: absolute; border: 1px dashed rgba(26,24,20,0.15); border-radius: 50%; }
  .orbit-1 { width: 340px; height: 340px; animation: orbit-rot 50s linear infinite; }
  .orbit-2 { width: 220px; height: 220px; animation: orbit-rot 35s linear infinite reverse; }
  .astrolabe-center { width: 100px; height: 100px; background: #4A5B4E; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 36px; box-shadow: 0 10px 30px rgba(74,91,78,0.25); z-index: 2; }
  
  .helper-bubble { position: absolute; background: #fff; border: 1px solid var(--border); padding: 10px 16px; border-radius: 24px; box-shadow: 0 6px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; font-size: 11px; text-align: left; width: 140px; }
  .b-pos1 { top: -15px; left: 100px; } .b-pos2 { top: 110px; right: -70px; } .b-pos3 { bottom: -15px; left: 100px; } .b-pos4 { top: 110px; left: -70px; }
  @keyframes orbit-rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  /* 💳 组件 D：常驻大交通、大件间夜预订底座 */
  .bottom-dock { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--border); padding: 10px 24px; border-radius: 32px; display: flex; gap: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.06); z-index: 10; }
  .dock-item { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 12px; font-weight: 600; cursor: pointer; transition: color 0.2s; }
  .dock-item:hover { color: var(--accent); }
  
  .bezier-sandbox-path { fill: none; stroke-linecap: round; pointer-events: stroke; cursor: pointer; transition: stroke-width 0.25s, stroke 0.25s; }
  @keyframes route-pulse-flow { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
  .bezier-sandbox-path.flowing { animation: route-pulse-flow 4s linear infinite; }

  .macro-clean-circle { background: #1A1814; color: #fff; border: 2px solid #fff; border-radius: 50%; width: 22px !important; height: 22px !important; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
  .loading-overlay { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .loading-title { font-size: 22px; font-weight: 500; color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-compass"></i></div>
        <div>
          <div class="logo-name">Mappd</div>
          <div class="tagline" style="font-size:11px; color:var(--ink3);">J人旅行AI助手</div>
        </div>
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-row">
        <div class="input-group"><label class="input-label">出发城市</label><input class="input-field" id="start-point" type="text" value="成都"></div>
        <div class="input-group"><label class="input-label">目的地群</label><input class="input-field" id="destination" type="text" value="美国"></div>
      </div>
      <div class="input-row">
        <div class="input-group"><label class="input-label">出发日期</label><input class="input-field" id="start-date" type="date" value="2026-10-01"></div>
        <div class="input-group">
          <div class="input-row" style="grid-template-columns: 1fr 1fr; gap:6px;">
            <div class="input-group"><label class="input-label">天数</label><input class="input-field" id="duration" type="number" value="13"></div>
            <div class="input-group"><label class="input-label">人数</label><input class="input-field" id="travelers" type="number" value="4"></div>
          </div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">首席规划偏好倾向 (可多选)</label>
        <div class="pref-tags">
          <div class="pref-tag selected" id="pref-drive" onclick="togglePrefTag('pref-drive')">🚗 自驾出行</div>
          <div class="pref-tag" id="pref-train" onclick="togglePrefTag('pref-train')">🚄 高铁/公共交通</div>
        </div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generateOptions()">
        <div class="spinner"></div>
        <span class="btn-text"><i class="ti ti-calculator"></i> &nbsp;一键Mappd我的攻略</span>
      </button>
    </div>
    
    <div class="divider"></div>
    <div class="results-scroll">
      <div class="empty-state" id="empty-state">
        <i class="ti ti-history"></i>
        <h3>下一站去哪儿</h3>
        <p>告诉我目的地，马上启航！</p>
      </div>
      <div id="options-list"></div>
    </div>
  </div>
  
  <div class="map-container" id="right-map-area">
    <div class="map-placeholder" id="map-placeholder">
      <div class="guide-title">J人旅行AI助手</div>
      <div class="guide-subtitle">还你极致掌控，消灭旅行前夜焦虑</div>
      <div class="astrolabe-wrapper">
        <div class="astrolabe-orbit orbit-1"></div><div class="astrolabe-orbit orbit-2"></div>
        <div class="astrolabe-center"><i class="ti ti-sparkles"></i></div>
        <div class="helper-bubble b-pos1"><b>智能理解</b><span>日期 | 人数 | 目的地 | 偏好</span></div>
        <div class="helper-bubble b-pos2"><b>智能规划</b><span>方案生成 | 最优推荐</span></div>
        <div class="helper-bubble b-pos3"><b>地图规划</b><span>一眼看懂 | 分天细化</span></div>
        <div class="helper-bubble b-pos4"><b>特惠直达</b><span>实时比价 | 直接购买</span></div>
      </div>
    </div>
    
    <div class="map-top-navigation-bar" id="map-navigation-bar" style="display: none;"></div>

    <div class="map-floating-micro-pane" id="map-floating-pane"></div>

    <div id="map"></div>
    
    <div class="bottom-dock" id="dynamic-fulfillment-dock">
      <div class="dock-item" onclick="triggerFulfillment('机票')"><i class="ti ti-plane"></i> 机票比价</div>
      <div class="dock-item" onclick="triggerFulfillment('交通')"><i class="ti ti-car"></i> 交通车务</div>
      <div class="dock-item" onclick="triggerFulfillment('酒店')"><i class="ti ti-building-skyscrapers"></i> 酒店特惠</div>
    </div>
    <div class="loading-overlay" id="loading-overlay"><div class="loading-title">J人专属路线测算中...</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null, curveOverlayLayer = null, macroMarkers = [], microMarkers = [], globalOptions = [];
let currentActiveSegments = [], currentOptionId = null, currentSelectedTabId = 'global';

function togglePrefTag(id) { document.getElementById(id).classList.toggle('selected'); }

function initMacroMap() {
  if (map) return;
  document.getElementById('map-placeholder').style.display = 'none';
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
  map.on('zoomend moveend viewreset', () => { if(globalOptions.length > 0 && currentSelectedTabId === 'global') redrawCurvesContainer(); });
}

function cleanLatLng(coordArray) {
  if (!coordArray || coordArray.length < 2) return null;
  const lat = parseFloat(coordArray[0]), lng = parseFloat(coordArray[1]);
  return (isNaN(lat) || isNaN(lng)) ? null : L.latLng(lat, lng);
}

function computePathDString(fromLatLng, toLatLng, isReturn) {
  const startP = map.latLngToLayerPoint(fromLatLng);
  const endP = map.latLngToLayerPoint(toLatLng);
  const midX = (startP.x + endP.x) / 2, midY = (startP.y + endP.y) / 2;
  const dx = endP.x - startP.x, dy = endP.y - startP.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len === 0) return '';
  const offset = len * 0.15;
  const nX = -dy / len, nY = dx / len;
  const controlX = midX + nX * (isReturn ? -offset : offset);
  const controlY = midY + nY * (isReturn ? -offset : offset);
  return `M ${startP.x} ${startP.y} Q ${controlX} ${controlY} ${endP.x} ${endP.y}`;
}

function redrawCurvesContainer() {
  if(curveOverlayLayer) { curveOverlayLayer.remove(); curveOverlayLayer = null; }
  if(!currentActiveSegments || currentActiveSegments.length === 0) return;

  const svgNS = "http://www.w3.org/2000/svg";
  const svgContainer = document.createElementNS(svgNS, "svg");
  svgContainer.setAttribute('style', 'position: absolute; pointer-events: none; width: 100%; height: 100%;');

  currentActiveSegments.forEach((seg, sIdx) => {
    const startLoc = cleanLatLng(seg.coords?.[0]), endLoc = cleanLatLng(seg.coords?.[1]);
    if (!startLoc || !endLoc || (startLoc.lat === endLoc.lat && startLoc.lng === endLoc.lng)) return;

    const dStr = computePathDString(startLoc, endLoc, seg.is_return || false);
    if (!dStr) return;

    const pathEl = document.createElementNS(svgNS, "path");
    const mode = seg.mode || 'flight';
    let strokeColor = '#B56545'; if(mode === 'drive') strokeColor = '#4A5B4E'; if(mode === 'train') strokeColor = '#3b5998';

    pathEl.setAttribute('d', dStr);
    pathEl.setAttribute('stroke', strokeColor);
    pathEl.setAttribute('stroke-width', '3.5');
    pathEl.setAttribute('opacity', '0.8');
    pathEl.setAttribute('class', 'bezier-sandbox-path flowing');
    pathEl.setAttribute('style', `stroke-dasharray: ${mode === 'drive' ? '12, 8' : (mode === 'train' ? '14, 6' : '4, 12')};`);

    svgContainer.appendChild(pathEl);
  });

  curveOverlayLayer = L.svgOverlay(svgContainer, [[-90, -180], [90, 180]]).addTo(map);
}

function formatDateOffset(startDateStr, dayOffset) {
  const d = new Date(startDateStr); d.setDate(d.getDate() + dayOffset);
  const weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  return `${d.getMonth()+1}月${d.getDate()}日 (${weeks[d.getDay()]})`;
}

async function generateOptions() {
  const start_point = document.getElementById('start-point').value;
  const destination = document.getElementById('destination').value;
  const startDate = document.getElementById('start-date').value;
  const days = document.getElementById('duration').value;
  const travelers = document.getElementById('travelers').value;
  const hasDrive = document.getElementById('pref-drive').classList.contains('selected');
  const hasTrain = document.getElementById('pref-train').classList.contains('selected');

  const btn = document.getElementById('gen-btn'); btn.disabled = true; btn.classList.add('loading');
  const overlay = document.getElementById('loading-overlay'); overlay.className = 'loading-overlay active';

  try {
    const res = await fetch('/api/plan_options', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start_point, destination, days, travelers, hasDrive, hasTrain })
    });
    const data = await res.json();
    globalOptions = data.options;
    
    initMacroMap();
    renderOptionCards(data.options);
    selectCard(0);
  } catch (e) {
    alert("演练测算异常");
  } finally {
    overlay.className = 'loading-overlay'; btn.disabled = false; btn.classList.remove('loading');
  }
}

function renderOptionCards(options) {
  const list = document.getElementById('options-list'); list.innerHTML = '';
  const est = document.getElementById('empty-state'); if(est) est.style.display = 'none';

  options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = `option-card ${idx === 0 ? 'active' : ''}`; card.id = `opt-card-${idx}`;
    card.innerHTML = `
      <div class="opt-header"><div class="opt-name">${opt.option_name}</div><div class="opt-badge">方案 ${idx + 1}</div></div>
      <div class="opt-desc" style="font-size:12px; color:var(--ink2); margin-bottom:10px;">📋 ${opt.logic_desc}</div>
      <div class="finance-block">
        <div class="fin-item"><div class="fin-label">团队精算开销</div><div class="fin-val">${opt.total_group_cost}</div></div>
        <div class="fin-item"><div class="fin-label">全员人均</div><div class="fin-val">${opt.cost_per_person}</div></div>
      </div>
      <button class="lock-btn">解锁此套方案并对齐地图沙盘 🚀</button>
    `;
    card.addEventListener('click', () => { selectCard(idx); });
    list.appendChild(card);
  });
}

function selectCard(idx) {
  document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
  const targetCard = document.getElementById(`opt-card-${idx}`); if(!targetCard) return;
  targetCard.classList.add('active');
  
  const opt = globalOptions[idx];
  if(!opt) return;

  currentOptionId = opt.option_id;
  currentActiveSegments = opt.macro_route?.segments || [];
  
  buildMapTopNavbar(opt);
  switchMapMasterView('global', 0);
}

function buildMapTopNavbar(opt) {
  const bar = document.getElementById('map-navigation-bar');
  bar.style.display = 'flex';
  const totalDays = parseInt(document.getElementById('duration').value) || 10;
  const startDateStr = document.getElementById('start-date').value;

  let navHtml = `<div class="map-nav-tab active" id="tab-nav-global" onclick="switchMapMasterView('global', 0)">📊 全局总地图动线</div>`;
  for(let i = 1; i <= totalDays; i++) {
    const dayCalendarText = formatDateOffset(startDateStr, i - 1);
    navHtml += `<div class="map-nav-tab" id="tab-nav-day-${i}" onclick="switchMapMasterView('day', ${i})">📅 ${dayCalendarText} (D${i})</div>`;
  }
  bar.innerHTML = navHtml;
}

// 💥 主战场全量视图路由切换机
function switchMapMasterView(type, dayNum) {
  document.querySelectorAll('.map-nav-tab').forEach(t => t.classList.remove('active'));
  const pane = document.getElementById('map-floating-pane');
  const dock = document.getElementById('dynamic-fulfillment-dock');
  microMarkers.forEach(m => m.remove()); microMarkers = [];

  if (type === 'global') {
    currentSelectedTabId = 'global';
    document.getElementById('tab-nav-global').classList.add('active');
    pane.classList.remove('active'); 
    
    clearAndRenderMacroAnchors();
    redrawCurvesContainer();

    dock.style.display = 'flex'; // 宏观Dock正常平铺
  } else {
    currentSelectedTabId = `day-${dayNum}`;
    document.getElementById(`tab-nav-day-${dayNum}`).classList.add('active');
    if(curveOverlayLayer) { curveOverlayLayer.remove(); curveOverlayLayer = null; }
    
    pane.classList.add('active');
    renderFloatingMicroPaneContent(dayNum);
    injectDayMicroMarkers(dayNum);

    dock.style.display = 'none'; // 💥 核心提效：分天隐藏大交通底座，全量走原子内嵌秒杀！
  }
}

function clearAndRenderMacroAnchors() {
  macroMarkers.forEach(m => m.remove()); macroMarkers = [];
  const opt = globalOptions.find(o => o.option_id === currentOptionId);
  if (!opt || !opt.macro_route?.anchors) return;
  
  map.setView([opt.macro_route.center_lat || 39.5, opt.macro_route.center_lng || -98.35], opt.macro_route.zoom_level || 4);

  opt.macro_route.anchors.forEach((anchor, aIdx) => {
    const validPoint = cleanLatLng(anchor.latlng); if(!validPoint) return;
    const cleanIcon = L.divIcon({ className: 'macro-clean-circle', html: `${aIdx + 1}`, iconSize: [22, 22], iconAnchor: [11, 11] });
    const m = L.marker(validPoint, { icon: cleanIcon }).addTo(map);
    m.bindTooltip(`<b>${aIdx+1}. ${anchor.name}</b>`, { permanent: true, direction: 'top', offset: [0, -12] });
    macroMarkers.push(m);
  });
}

function injectDayMicroMarkers(dayNum) {
  const currentCenter = map.getCenter();
  const simulatedOffsets = [
    { name: "上午核心景点 (分时免排队网关)", lat: currentCenter.lat + 0.04, lng: currentCenter.lng - 0.03, label: "A" },
    { name: "中午特色黑珍珠私房必吃榜", lat: currentCenter.lat - 0.02, lng: currentCenter.lng + 0.04, label: "B" }
  ];

  simulatedOffsets.forEach(spot => {
    const microIcon = L.divIcon({ className: 'macro-clean-circle', html: spot.label, iconSize: [18, 18], iconAnchor: [9, 9] });
    const m = L.marker([spot.lat, spot.lng], { icon: microIcon }).addTo(map);
    m.bindTooltip(`<div style="font-size:11px; font-weight:600;">${spot.label}. ${spot.name}</div>`, { permanent: true, direction: 'right' });
    microMarkers.push(m);
  });
  
  if(microMarkers.length > 0) {
    const group = new L.featureGroup(microMarkers);
    map.fitBounds(group.getBounds().pad(0.5));
  }
}

// 💥 商业化效率最大化重构：直接把免检索分时秒杀网关嵌入微观节点内部
function renderFloatingMicroPaneContent(dayNum) {
  const pane = document.getElementById('map-floating-pane');
  const travelers = document.getElementById('travelers').value;
  const startDateStr = document.getElementById('start-date').value;
  const targetDateText = formatDateOffset(startDateStr, dayNum - 1);

  const mockProductData = [
    { label: "A", time: "09:30", title: "核心历史地标/分时国家美术馆", desc: "💡 国庆期间现场排队预计短则60分钟。已为您智能对准 09:30 黄金早场空位。", action: "🎫 锁定免排队电子门票", prodName: "国家美术馆分时免排队门票" },
    { label: "B", time: "12:45", title: "当地高分必吃榜/老字号私房特色风味", desc: "💡 该店极度紧俏，不接受现场排号。小助手已占用最精确的堂食留位波段。", action: "🍛 锁定 12:45 留座餐券", prodName: "特色地道双人精选午餐订座券" }
  ];

  let contentHtml = `<div class="micro-pane-title"><span>🗓️ ${targetDateText} (D${dayNum}) 细节精算</span><i class="ti ti-checklist" style="color:var(--accent);"></i></div>`;

  contentHtml += mockProductData.map(item => `
    <div class="micro-spot-card">
      <span class="micro-spot-tag tag-view">${item.time}</span>
      <div style="font-weight:600; font-size:13px; margin-top:2px; padding-right:40px;">[${item.label}点] ${item.title}</div>
      <div style="font-size:11px; color:var(--ink2); margin-top:5px; line-height:1.4;">${item.desc}</div>
      
      <button class="lock-btn" onclick="triggerDirectContextBooking('${item.prodName}', '${targetDateText}', ${travelers}, event)">
        ${item.action}
      </button>
    </div>
  `).join('');

  pane.innerHTML = contentHtml;
}

function triggerDirectContextBooking(productName, dateText, people, event) {
  event.stopPropagation();
  alert(`🛒 【Mappd 原子上下文秒杀网关解锁】\n==============================\n【直达商品】：${productName}\n【锁定日期】：${dateText}\n【预约人数】：${people} 人\n==============================\n🚀 参数已全自动100%无缝注入高频供应链接口，直接跳过检索完成出票！`);
}

function triggerFulfillment(type) {
  const activeCard = document.querySelector('.option-card.active'); if (!activeCard) return;
  const idx = parseInt(activeCard.id.replace('opt-card-', ''));
  const opt = globalOptions[idx];
  alert(`🛒 大件大交通网关：\n已捕捉当前【${opt.option_name}】全盘时间节点，正在一键外跳锁单【${type}】享受分成派单返佣！`);
}
</script>
