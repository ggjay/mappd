<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappd — 大路线智能沙盘决策器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F2EC; --surface: #FDFBF7; --surface2: #F0EDE5;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #9E9B94;
    --accent: #2D6A4F; --accent-light: #D8EDDF; --accent2: #B5451B;
    --border: rgba(26,24,20,0.1); --border2: rgba(26,24,20,0.06);
    --radius: 12px; --radius-sm: 8px;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
  .app { display: grid; grid-template-columns: 450px 1fr; height: 100vh; overflow: hidden; }
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 24px 24px 0; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo-mark { width: 32px; height: 32px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-mark i { color: var(--surface); font-size: 17px; }
  .logo-name { font-family: var(--font-display); font-size: 22px; color: var(--ink); letter-spacing: -0.3px; }
  .logo-name span { color: var(--accent); }
  .tagline { font-size: 13px; color: var(--ink3); }
  
  .input-section { padding: 0 24px; flex-shrink: 0; }
  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; display: block; }
  .input-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .input-field:focus { border-color: var(--accent); }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  .gen-btn { width: 100%; padding: 13px; background: var(--ink); color: var(--surface); border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; margin-bottom: 16px; }
  .gen-btn:disabled { background: var(--ink3); cursor: not-allowed; }
  .gen-btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .divider { height: 1px; background: var(--border2); margin: 0 24px; flex-shrink: 0; }
  .results-scroll { flex: 1; overflow-y: auto; padding: 20px 24px 24px; }
  
  .option-card { background: var(--bg); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; cursor: pointer; transition: all 0.2s ease; position: relative; }
  .option-card:hover { border-color: rgba(45,106,79,0.4); }
  .option-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 4px 20px rgba(45,106,79,0.08); }
  
  .opt-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .opt-name { font-size: 15px; font-weight: 600; color: var(--ink); flex: 1; padding-right: 10px; }
  .opt-badge { font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 500; background: var(--surface2); color: var(--ink2); }
  .option-card.active .opt-badge { background: var(--accent); color: #fff; }
  
  .opt-desc { font-size: 13px; color: var(--ink2); margin-bottom: 16px; line-height: 1.5; }
  
  .finance-block { display: flex; gap: 16px; background: rgba(26,24,20,0.03); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .option-card.active .finance-block { background: rgba(45,106,79,0.04); }
  .fin-item { flex: 1; }
  .fin-label { font-size: 11px; color: var(--ink3); text-transform: uppercase; }
  .fin-val { font-size: 18px; font-weight: 700; color: var(--accent2); }
  .option-card.active .fin-val { color: var(--accent); }
  
  .detail-section { margin-bottom: 14px; }
  .detail-title { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
  .detail-row { font-size: 12px; display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border2); color: var(--ink2); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row span:last-child { font-weight: 500; color: var(--ink); }
  
  .lock-btn { width: 100%; padding: 10px; background: var(--ink); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; margin-top: 14px; cursor: pointer; display: none; text-align: center; }
  .option-card.active .lock-btn { display: block; }
  .lock-btn:hover { background: #2d2b27; }

  .empty-state { text-align: center; padding: 60px 0; color: var(--ink3); }
  .empty-state i { font-size: 40px; opacity: 0.3; display: block; margin-bottom: 12px; }
  
  .map-container { position: relative; background: #e8e0d0; height: 100vh; }
  #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
  .map-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #e8e0d0; z-index: 5; }
  .map-placeholder-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(26,24,20,0.06); display: flex; align-items: center; justify-content: center; }
  .map-placeholder-icon i { font-size: 32px; color: var(--ink3); }
  
  .map-title-pill { position: absolute; top: 16px; left: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 8px 18px; font-size: 13px; font-weight: 500; color: var(--ink); z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
  
  .line-label-popup { background: #fff; border: 1.5px solid var(--ink); padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.1); white-space: nowrap; }
  
  .loading-overlay { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .loading-title { font-family: var(--font-display); font-size: 24px; color: var(--ink); }
  .notif { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 200; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
  .notif.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-compass"></i></div>
        <div>
          <div class="logo-name">Mapp<span>d</span></div>
          <div class="tagline">大路线智能沙盘决策体系</div>
        </div>
      </div>
    </div>
    
    <div class="input-section">
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">出发城市</label>
          <input class="input-field" id="start-point" placeholder="例如：成都" type="text" value="成都">
        </div>
        <div class="input-group">
          <label class="input-label">目的地群</label>
          <input class="input-field" id="destination" placeholder="例如：西班牙、葡萄牙" type="text" value="西班牙、葡萄牙、亚速尔群岛">
        </div>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">行程天数</label>
          <input class="input-field" id="duration" placeholder="10" type="number" min="1" max="30" value="10">
        </div>
        <div class="input-group">
          <label class="input-label">旅行人数</label>
          <input class="input-field" id="travelers" placeholder="2" type="number" min="1" max="20" value="2">
        </div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="generateOptions()">
        <div class="spinner"></div>
        <span class="btn-text"><i class="ti ti-calculator"></i> &nbsp;开始大路线精算演练</span>
      </button>
    </div>
    
    <div class="divider"></div>
    <div class="results-scroll">
      <div class="empty-state" id="empty-state">
        <i class="ti ti-device-analytics"></i>
        <p>配置沙盘参数，大模型将为您同屏<br>精算国际往返、跨国自驾及多段间夜</p>
      </div>
      <div id="options-list"></div>
    </div>
  </div>
  
  <div class="map-container">
    <div class="map-placeholder" id="map-placeholder">
      <div class="map-placeholder-icon"><i class="ti ti-map-2"></i></div>
      <p>宏观航线拓扑连线将跟随方案实时呈现</p>
    </div>
    <div id="map"></div>
    <div class="map-title-pill" id="map-title-pill"></div>
    
    <div class="loading-overlay" id="loading-overlay">
      <div class="loading-title">精算师正在构建宏观轨迹沙盘...</div>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null, macroMarkers = [], macroLayers = [], globalOptions = [];

function showNotif(msg) {
  const n = document.getElementById('notif'); n.textContent = msg; n.className = 'notif show';
  setTimeout(() => n.className = 'notif', 4000);
}

function initMacroMap(lat, lng, zoom) {
  if (map) { map.remove(); map = null; }
  document.getElementById('map-placeholder').style.display = 'none';
  map = L.map('map', { zoomControl: false }).setView([lat, lng], zoom);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 12
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
}

function clearMacroLayers() {
  macroMarkers.forEach(m => m.remove()); macroMarkers = [];
  macroLayers.forEach(l => l.remove()); macroLayers = [];
}

function drawMacroRoute(routeData) {
  clearMacroLayers();
  
  // 核心视觉修正：默认将视角完美锁死在欧洲核心西葡海岛区，彻底屏蔽成都干扰
  const centerLat = routeData.europe_center ? routeData.europe_center[0] : (routeData.center_lat || 39.5);
  const centerLng = routeData.europe_center ? routeData.europe_center[1] : (routeData.center_lng || -8.0);
  const zoomLevel = routeData.zoom_level || 5;

  if (!map) {
    initMacroMap(centerLat, centerLng, zoomLevel);
  } else {
    map.setView([centerLat, centerLng], zoomLevel);
  }

  // 1. 绘制分段多轨迹线
  if (routeData.segments && routeData.segments.length) {
    routeData.segments.forEach(seg => {
      const isDrive = seg.mode === 'drive';
      const lineColor = isDrive ? '#2D6A4F' : '#B5451B';
      const lineDash = isDrive ? '6, 6' : '3, 8';
      const lineWeight = isDrive ? 3.5 : 3;

      const poly = L.polyline(seg.coords, {
        color: lineColor, weight: lineWeight, opacity: 0.9, dashArray: lineDash
      }).addTo(map);
      macroLayers.push(poly);

      // 计算中心点悬浮时间小气泡
      if(seg.coords.length >= 2) {
        const midLat = (seg.coords[0][0] + seg.coords[1][0]) / 2;
        const midLng = (seg.coords[0][1] + seg.coords[1][1]) / 2;
        
        const labelIcon = L.divIcon({
          html: `<div class="line-label-popup" style="color: ${lineColor}; border-color: ${lineColor};">
                  ${isDrive ? '🚗' : '✈️'} ${seg.days_label} ${seg.title || ''}
                 </div>`,
          className: '',
          iconAnchor: [60, 10]
        });
        const labelMarker = L.marker([midLat, midLng], { icon: labelIcon }).addTo(map);
        macroLayers.push(labelMarker);
      }
    });
  }

  // 2. 标出枢纽大城市别针
  if (routeData.anchors && routeData.anchors.length) {
    routeData.anchors.forEach(anchor => {
      const icon = L.divIcon({
        html: `<div style="background:#1A1814;color:#fff;padding:5px 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.15);"><i class="ti ti-map-pin"></i> ${anchor.name}</div>`,
        className: '', iconAnchor: [40, 12]
      });
      const m = L.marker([anchor.lat, anchor.lng], { icon }).addTo(map);
      m.bindPopup(`<b>${anchor.name}</b><br><span style="font-size:12px;color:#666;">${anchor.role}</span>`);
      macroMarkers.push(m);
    });
  }
}

async function generateOptions() {
  const start_point = document.getElementById('start-point').value.trim();
  const destination = document.getElementById('destination').value.trim();
  const days = document.getElementById('duration').value;
  const travelers = document.getElementById('travelers').value;

  if (!start_point || !destination) { showNotif('请输入出发地与目的地！'); return; }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('loading-overlay').classList.add('active');

  try {
    const res = await fetch('/api/plan_options/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start_point, destination, days, travelers })
    });

    if (!res.ok) throw new Error('接口状态码错误 ' + res.status);
    const data = await res.json();
    if (!data.options || !data.options.length) throw new Error('模型未生成标准数据');
    
    globalOptions = data.options;
    renderOptionCards(data.options);
    
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('loading-overlay').classList.remove('active');
    selectCard(0);

  } catch (e) {
    document.getElementById('loading-overlay').classList.remove('active');
    showNotif('测算中断：' + e.message);
    console.error(e);
  }
  btn.disabled = false; btn.classList.remove('loading');
}

function renderOptionCards(options) {
  const list = document.getElementById('options-list');
  list.innerHTML = '';

  options.forEach((opt, idx) => {
    const card = document.createElement('div');
    card.className = `option-card ${idx === 0 ? 'active' : ''}`;
    card.id = `opt-card-${idx}`;
    
    let flightHtml = opt.flights.map(f => `
      <div class="detail-row"><span>✈️ ${f.segment} (${f.route})</span><span>人均:${f.cost_per_person}</span></div>
    `).join('');

    let carHtml = opt.car_rentals.map(c => `
      <div class="detail-row"><span>🚗 ${c.region}</span><span>总额:${c.total_car_cost}</span></div>
      <div style="font-size:11px;color:#856404;background:#FFF9E6;padding:4px 6px;margin:4px 0 8px;border-radius:4px;">💡 ${c.alert}</div>
    `).join('');

    let hotelHtml = opt.accommodation.map(h => `
      <div class="detail-row"><span>🏨 ${h.city} (住${h.nights}晚)</span><span>单价:${h.avg_price_per_night}</span></div>
    `).join('');

    card.innerHTML = `
      <div class="opt-header">
        <div class="opt-name">${opt.option_name}</div>
        <div class="opt-badge">方案 ${idx + 1}</div>
      </div>
      <div class="opt-desc">${opt.logic_desc}</div>
      
      <div class="finance-block">
        <div class="fin-item"><div class="fin-label">团队总开销</div><div class="fin-val">${opt.total_group_cost}</div></div>
        <div class="fin-item"><div class="fin-label">全员人均</div><div class="fin-val">${opt.cost_per_person}</div></div>
      </div>

      <div class="detail-section"><div class="detail-title"><i class="ti ti-plane-departure"></i> 大交通机票精算</div>${flightHtml}</div>
      <div class="detail-section"><div class="detail-title"><i class="ti ti-car"></i> 车辆自驾/交通开销</div>${carHtml}</div>
      <div class="detail-section"><div class="detail-title"><i class="ti ti-bed"></i> 每日间夜宿锚分配</div>${hotelHtml}</div>

      <button class="lock-btn" onclick="lockThisOption(${opt.option_id}, event)">
        锁定此大方向，开始细构每日景点 🚀
      </button>
    `;

    card.addEventListener('click', (e) => {
      if(e.target.tagName === 'BUTTON' || e.target.parentElement.tagName === 'BUTTON') return;
      selectCard(idx);
    });
    list.appendChild(card);
  });
}

function selectCard(idx) {
  document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`opt-card-${idx}`).classList.add('active');
  
  if(globalOptions[idx] && globalOptions[idx].macro_route) {
    drawMacroRoute(globalOptions[idx].macro_route);
    const pill = document.getElementById('map-title-pill');
    pill.textContent = globalOptions[idx].option_name;
    pill.style.display = 'block';
  }
}

function lockThisOption(optionId, event) {
  event.stopPropagation();
  alert(`成功选定大框架 [${optionId}]！下一期我们将开发“第二阶段：解锁微观景点地图”。`);
}
</script>
</body>
</html>
