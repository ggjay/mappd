<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mappd — 一键整合旅行攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F2EC; --surface: #FDFBF7; --surface2: #F0EDE5;
    --ink: #1A1814; --ink2: #6B6860; --ink3: #9E9B94;
    --accent: #2D6A4F; --accent-light: #D8EDDF; --accent2: #B5451B;
    --border: rgba(26,24,20,0.1); --border2: rgba(26,24,20,0.06);
    --radius: 12px; --radius-sm: 8px;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
  .app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; overflow: hidden; }
  .panel { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 28px 28px 0; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-mark { width: 32px; height: 32px; background: var(--ink); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-mark i { color: var(--surface); font-size: 17px; }
  .logo-name { font-family: var(--font-display); font-size: 22px; color: var(--ink); letter-spacing: -0.3px; }
  .logo-name span { color: var(--accent); }
  .tagline { font-size: 13px; color: var(--ink3); margin-top: 2px; }
  .input-section { padding: 0 28px; flex-shrink: 0; }
  .input-group { margin-bottom: 14px; }
  .input-label { font-size: 11px; font-weight: 500; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: block; }
  .input-field { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; font-family: var(--font-body); font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .input-field:focus { border-color: var(--accent); }
  .input-field::placeholder { color: var(--ink3); }
  .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tag-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border); font-size: 12px; color: var(--ink2); cursor: pointer; background: var(--surface); transition: all 0.15s; user-select: none; }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .gen-btn { width: 100%; padding: 13px; background: var(--ink); color: var(--surface); border: none; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; margin-bottom: 20px; transition: background 0.15s; }
  .gen-btn:hover { background: #2d2b27; }
  .gen-btn:disabled { background: var(--ink3); cursor: not-allowed; }
  .gen-btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .gen-btn.loading .spinner { display: block; }
  .gen-btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { height: 1px; background: var(--border2); margin: 0 28px; flex-shrink: 0; }
  .results-scroll { flex: 1; overflow-y: auto; padding: 20px 28px 28px; }
  .results-scroll::-webkit-scrollbar { width: 4px; }
  .results-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .section-title { font-size: 11px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 14px; }
  .place-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; }
  .place-card:hover { border-color: rgba(45,106,79,0.4); transform: translateY(-1px); }
  .place-card.active { border-color: var(--accent); background: var(--accent-light); }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-num { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .place-card.active .card-num { background: var(--accent); }
  .card-body { flex: 1; min-width: 0; }
  .card-name { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .card-type { font-size: 11px; color: var(--ink3); }
  .card-badges { display: flex; gap: 5px; margin-left: auto; flex-shrink: 0; }
  .cbadge { font-size: 10px; padding: 2px 8px; border-radius: 99px; }
  .cbadge-green { background: var(--accent-light); color: var(--accent); }
  .cbadge-orange { background: #FDEBD8; color: #B5451B; }
  .card-desc { font-size: 12px; color: var(--ink2); margin-top: 8px; line-height: 1.6; }
  .card-meta { display: flex; gap: 12px; margin-top: 8px; }
  .meta-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink3); }
  .card-sources { font-size: 10px; color: var(--ink3); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border2); }
  .empty-state { text-align: center; padding: 48px 0; color: var(--ink3); }
  .empty-state i { font-size: 36px; opacity: 0.3; display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }
  .map-container { position: relative; background: #e8e0d0; overflow: hidden; height: 100vh; }
  #map { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 1; }
  .map-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #e8e0d0; z-index: 5; }
  .map-placeholder-icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(26,24,20,0.06); display: flex; align-items: center; justify-content: center; }
  .map-placeholder-icon i { font-size: 32px; color: var(--ink3); }
  .map-placeholder p { font-size: 14px; color: var(--ink3); }
  .map-topbar { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 10px; z-index: 10; pointer-events: none; }
  .map-title-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 8px 18px; font-size: 13px; font-weight: 500; color: var(--ink); pointer-events: auto; opacity: 0; transition: opacity 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .map-title-pill.visible { opacity: 1; }
  .day-switcher { display: flex; gap: 6px; pointer-events: auto; opacity: 0; transition: opacity 0.3s; }
  .day-switcher.visible { opacity: 1; }
  .day-btn { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; cursor: pointer; color: var(--ink2); transition: all 0.15s; font-family: var(--font-body); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .day-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .loading-overlay { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .loading-overlay.active { opacity: 1; pointer-events: all; }
  .loading-title { font-family: var(--font-display); font-size: 24px; color: var(--ink); }
  .loading-steps { display: flex; flex-direction: column; gap: 10px; width: 280px; }
  .loading-step { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink2); opacity: 0.3; transition: opacity 0.4s; }
  .loading-step.done { opacity: 1; color: var(--accent); }
  .loading-step.active { opacity: 1; }
  .loading-step i { font-size: 16px; }
  .step-spinner { width: 16px; height: 16px; border: 1.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  .notif { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 200; transform: translateY(20px); opacity: 0; transition: all 0.3s; pointer-events: none; }
  .notif.show { transform: translateY(0); opacity: 1; }
  .notif.error { background: #B5451B; }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="panel-header">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-map-pin"></i></div>
        <div>
          <div class="logo-name">Mapp<span>d</span></div>
          <div class="tagline">把散乱攻略，变成一张可以走的地图</div>
        </div>
      </div>
    </div>
    <div class="input-section">
      <div class="input-group">
        <label class="input-label">目的地</label>
        <input class="input-field" id="destination" placeholder="例如：京都、大阪、马德里…" type="text">
      </div>
      <div class="input-row">
        <div class="input-group">
          <label class="input-label">出发时间</label>
          <input class="input-field" id="travel-date" type="month">
        </div>
        <div class="input-group">
          <label class="input-label">行程天数</label>
          <input class="input-field" id="duration" placeholder="3" type="number" min="1" max="14" value="3">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">旅行偏好</label>
        <div class="tag-group" id="pref-tags">
          <div class="tag active" data-val="文化寺庙">文化寺庙</div>
          <div class="tag" data-val="美食探索">美食探索</div>
          <div class="tag" data-val="自然风景">自然风景</div>
          <div class="tag" data-val="购物">购物</div>
          <div class="tag" data-val="小众秘境">小众秘境</div>
          <div class="tag" data-val="亲子">亲子</div>
        </div>
      </div>
      <button class="gen-btn" id="gen-btn" onclick="startGenerate()">
        <div class="spinner"></div>
        <span class="btn-text"><i class="ti ti-sparkles" style="font-size:15px;"></i> &nbsp;生成我的攻略地图</span>
      </button>
    </div>
    <div class="divider"></div>
    <div class="results-scroll">
      <div class="empty-state" id="empty-state">
        <i class="ti ti-map-2"></i>
        <p>输入目的地，AI 自动整合攻略<br>生成你的专属路线地图</p>
      </div>
      <div id="place-list" style="display:none;"></div>
    </div>
  </div>
  <div class="map-container">
    <div class="map-placeholder" id="map-placeholder">
      <div class="map-placeholder-icon"><i class="ti ti-map"></i></div>
      <p>地图将在生成攻略后显示</p>
    </div>
    <div id="map"></div>
    <div class="map-topbar">
      <div class="map-title-pill" id="map-title-pill"></div>
      <div class="day-switcher" id="day-switcher"></div>
    </div>
    <div class="loading-overlay" id="loading-overlay">
      <div class="loading-title">正在整合攻略…</div>
      <div class="loading-steps">
        <div class="loading-step" id="step-1"><div class="step-spinner"></div> 搜索目的地旅行信息</div>
        <div class="loading-step" id="step-2"><i class="ti ti-brain"></i> AI 分析整合多篇攻略</div>
        <div class="loading-step" id="step-3"><i class="ti ti-map-pin"></i> 提取核心点位与路线</div>
        <div class="loading-step" id="step-4"><i class="ti ti-route"></i> 按天规划最优顺序</div>
      </div>
    </div>
  </div>
</div>
<div class="notif" id="notif"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map = null, markers = [], routeLayer = null, currentPlaces = [], selectedDay = 1;

document.querySelectorAll('.tag').forEach(t => t.addEventListener('click', () => t.classList.toggle('active')));
function getPrefs() { return [...document.querySelectorAll('.tag.active')].map(t => t.dataset.val).join('、'); }

function showNotif(msg, isError = false) {
  const n = document.getElementById('notif');
  n.textContent = msg; n.className = 'notif show' + (isError ? ' error' : '');
  setTimeout(() => n.className = 'notif', 4500);
}

function setLoadingStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step-' + i);
    if (i < n) { el.classList.add('done'); el.classList.remove('active'); }
    else if (i === n) { el.classList.add('active'); el.classList.remove('done'); }
    else { el.classList.remove('done', 'active'); }
  }
}

function initMap(lat, lng) {
  if (map) { map.remove(); map = null; }
  document.getElementById('map-placeholder').style.display = 'none';
  
  map = L.map('map', { zoomControl: false }).setView([lat, lng], 13);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', 
    maxZoom: 19
  }).addTo(map);
  
  L.control.zoom({ position: 'bottomright' }).addTo(map);
}

function clearMap() {
  markers.forEach(m => m.remove()); markers = [];
  if (routeLayer) { routeLayer.remove(); routeLayer = null; }
}

function renderDay(day) {
  clearMap();
  const places = currentPlaces.filter(p => {
    const pDay = typeof p.day === 'string' ? parseInt(p.day.replace(/[^0-9]/g, '')) : p.day;
    return pDay === day;
  });
  
  if (!places.length) return;
  
  const validCoords = places.filter(p => !isNaN(parseFloat(p.lat)) && !isNaN(parseFloat(p.lng)));
  if (!validCoords.length) return;
  
  routeLayer = L.polyline(validCoords.map(p => [parseFloat(p.lat), parseFloat(p.lng)]), {
    color: '#2D6A4F', weight: 2.5, opacity: 0.7, dashArray: '6,5'
  }).addTo(map);
  
  validCoords.forEach((p, i) => {
    const bg = p.type === 'food' ? '#B5451B' : p.type === 'nature' ? '#2D6A4F' : '#1A1814';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:32px;height:32px;border-radius:50%;background:${bg};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.2);">${i+1}</div>`,
      iconSize: [32,32], iconAnchor: [16,16]
    });
    const m = L.marker([parseFloat(p.lat), parseFloat(p.lng)], { icon }).addTo(map);
    m.bindPopup(`<div style="min-width:200px;">
      <div style="font-weight:500;font-size:14px;margin-bottom:4px;">${p.name}</div>
      <div style="font-size:12px;color:#6B6860;margin-bottom:8px;">${p.desc}</div>
      <div style="font-size:11px;color:#9E9B94;">⏱ 建议: ${p.duration || '1-2小时'} · ${p.tips || ''}</div>
    </div>`, { maxWidth: 260 });
    markers.push(m);
  });
  
  if (validCoords.length > 0) {
    map.fitBounds(routeLayer.getBounds(), { padding: [60,60] });
  }
}

function renderDaySwitcher(days) {
  const sw = document.getElementById('day-switcher');
  sw.innerHTML = days.map(d => `<button class="day-btn${d===1?' active':''}" onclick="switchDay(${d})">Day ${d}</button>`).join('');
  sw.classList.add('visible');
}

function switchDay(day) {
  selectedDay = day;
  document.querySelectorAll('.day-btn').forEach(b => {
    const bNum = parseInt(b.textContent.replace('Day ',''));
    b.classList.toggle('active', bNum === day);
  });
  renderDay(day);
}

function renderPlaceList(places) {
  const list = document.getElementById('place-list');
  const days = [...new Set(places.map(p => typeof p.day === 'string' ? parseInt(p.day.replace(/[^0-9]/g, '')) : p.day))].sort((a,b)=>a-b);
  list.innerHTML = '';
  
  days.forEach(day => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.style.marginTop = day > 1 ? '20px' : '0';
    title.textContent = `Day ${day}`;
    list.appendChild(title);
    
    const dayPlaces = places.filter(p => {
      const pDay = typeof p.day === 'string' ? parseInt(p.day.replace(/[^0-9]/g, '')) : p.day;
      return pDay === day;
    });

    dayPlaces.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'place-card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-num">${i+1}</div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-type">${p.category || '景点'}</div>
          </div>
          <div class="card-badges">
            ${p.must ? '<span class="cbadge cbadge-green">必去</span>' : ''}
            ${p.type==='food' ? '<span class="cbadge cbadge-orange">美食</span>' : ''}
          </div>
        </div>
        <div class="card-desc">${p.desc || ''}</div>
        <div class="card-meta">
          <div class="meta-item"><i class="ti ti-clock" style="font-size:12px;"></i>${p.duration || '1-2小时'}</div>
        </div>
        <div class="card-sources">📌 ${p.tips || '暂无特别提示'}</div>`;
      
      card.onclick = () => {
        document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        switchDay(day);
        const latVal = parseFloat(p.lat);
        const lngVal = parseFloat(p.lng);
        if (map && !isNaN(latVal) && !isNaN(lngVal)) map.setView([latVal, lngVal], 15);
        markers[i] && markers[i].openPopup();
      };
      list.appendChild(card);
    });
  });
  document.getElementById('empty-state').style.display = 'none';
  list.style.display = 'block';
}

async function startGenerate() {
  const dest = document.getElementById('destination').value.trim();
  if (!dest) { showNotif('请输入目的地', true); return; }
  const duration = document.getElementById('duration').value || '3';
  
  const btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.classList.add('loading');
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('active');
  
  setLoadingStep(1);
  await new Promise(r => setTimeout(r, 300));
  setLoadingStep(2);
  
  try {
    setLoadingStep(3);
    const res = await fetch('/api/generate/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        destination: dest, 
        days: parseInt(duration) 
      })
    });
    
    // 🔍 打印第一步：查看原始返回包状态
    console.log("服务器响应状态码:", res.status);
    
    // 获取响应文本
    const rawText = await res.text();
    // 🔍 打印第二步：在控制台无死角还原大模型吐出的所有数据
    console.log("=== AI原始返回数据（点开看详情） ===");
    console.log(rawText);
    console.log("=====================================");

    if (!res.ok) throw new Error(`服务器返回错误: ${res.status}。详情见控制台。`);
    
    let places;
    try {
      places = JSON.parse(rawText);
    } catch(parseErr) {
      console.error("JSON解析失败，尝试备用正则提取...", parseErr);
      // 备用正则强行捕获 [ ... ]
      const jsonMatch = rawText.match(/\[\s*\{[\s\S]*\}\s*\]/);
      if (jsonMatch) {
        places = JSON.parse(jsonMatch[0]);
      } else {
        throw new Error("返回结果无法被解析为标准的数组列表，请看 F12 控制台日志。");
      }
    }
    
    setLoadingStep(4);
    if (!places || !places.length || places.error) {
      throw new Error(places.error || 'AI 返回数据格式为空，请重试');
    }
    
    currentPlaces = places;
    overlay.classList.remove('active');
    
    // 过滤掉没有合法坐标的点
    const validPlaces = places.filter(p => !isNaN(parseFloat(p.lat)) && !isNaN(parseFloat(p.lng)));
    if(!validPlaces.length) {
      throw new Error("AI 生成了文字攻略，但未能给出有效的地图经纬度坐标。");
    }
    
    const centerLat = validPlaces.reduce((s,p) => s + parseFloat(p.lat), 0) / validPlaces.length;
    const centerLng = validPlaces.reduce((s,p) => s + parseFloat(p.lng), 0) / validPlaces.length;
    
    initMap(centerLat, centerLng);
    
    const days = [...new Set(places.map(p => typeof p.day === 'string' ? parseInt(p.day.replace(/[^0-9]/g, '')) : p.day))].sort((a,b)=>a-b);
    selectedDay = 1;
    renderDaySwitcher(days);
    renderDay(1);
    renderPlaceList(places);
    
    document.getElementById('map-title-pill').textContent = `${dest} · ${duration}天行程`;
    document.getElementById('map-title-pill').classList.add('visible');
  } catch(e) {
    overlay.classList.remove('active');
    showNotif('生成失败：' + e.message, true);
    console.error("捕获的详细错误对象:", e);
  }
  btn.disabled = false; btn.classList.remove('loading');
}

window.addEventListener('load', () => {
  const now = new Date();
  document.getElementById('travel-date').value = `${now.getFullYear()}-${String(now.getMonth()+2).padStart(2,'0')}`;
});
document.getElementById('destination').addEventListener('keydown', e => { if (e.key==='Enter') startGenerate(); });
</script>
